name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        run: |
          curl -fsS "https://wknkdfajfnogagdastex.supabase.co/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo
          echo "Supabase answered OK"
